<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F2F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17101F" media="(prefers-color-scheme: dark)">
<meta name="description" content="a prime resource for survival">
<title>云贵川风味家常菜 · 书单</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23241A2E'/%3E%3Crect x='6' y='9' width='4' height='17' fill='%23EF45A0'/%3E%3Crect x='11' y='6' width='4' height='20' fill='%23F18336'/%3E%3Crect x='16' y='11' width='4' height='15' fill='%233BB974'/%3E%3Crect x='21' y='7' width='4' height='19' fill='%235D98F0'/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #F4F2F8;
    --paper-2: #ECE9F2;
    --surface: #FCFBFE;
    --ink: #241A2E;
    --muted: #6B6578;
    --line: #D9D5E0;
    --focus: #8047E1;
    --hot: #C4247A;
    --ink-soft: rgba(36, 26, 46, .34);
    --focus-soft: rgba(128, 71, 225, .22);

    /* 十三个主题，色相绕一圈；最后两个是棕和黑 */
    --c-q: #EF45A0;  --c-x: #E54B52;  --c-w: #F18336;  --c-a: #EEC743;
    --c-t: #A2C854;  --c-b: #3BB974;  --c-m: #2CB3B3;  --c-g: #3FABDC;
    --c-s: #3D7EDE;  --c-p: #5E4BC3;  --c-f: #A14CCE;  --c-h: #875F3E;
    --c-l: #3F3B46;  --c-none: #B9B4C4;

    --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "Noto Serif SC", "Source Han Serif SC", "Source Han Serif CN", "SimSun", serif;
    --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    --gutter: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #17101F;
      --paper-2: #1F1729;
      --surface: #231B2D;
      --ink: #E9E6EE;
      --muted: #A09BAC;
      --line: #393144;
      --focus: #B79BFF;
      --hot: #FF7CC0;
      --ink-soft: rgba(233, 230, 238, .34);
      --focus-soft: rgba(183, 155, 255, .28);
      --c-q: #FF6CB8;  --c-x: #FA6F70;  --c-w: #FFA161;  --c-a: #FEDB6D;
      --c-t: #BDE07B;  --c-b: #67D191;  --c-m: #5FCBCB;  --c-g: #69C4F1;
      --c-s: #5D98F0;  --c-p: #8C7FEA;  --c-f: #C583EC;  --c-h: #B08B6B;
      --c-l: #8D8898;  --c-none: #5A5366;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.55;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  body.locked { overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 var(--gutter); }

  /* ── 开头 ── */
  .masthead { padding: calc(26px + env(safe-area-inset-top)) var(--gutter) 16px; }
  h1 {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 700;
    line-height: 1.5;
    letter-spacing: 0.18em;
  }
  h1 .sep { margin: 0 .35em; font-weight: 400; }
  .motto { margin: 7px 0 0 -0.5em; font-size: 14px; color: var(--muted); }
  .motto span { font-family: Georgia, "Times New Roman", var(--serif); font-style: italic; font-size: 15px; letter-spacing: 0.03em; }

  .shelf {
    display: block;
    width: 100%;
    margin-top: 22px;
    border-bottom: 2px solid var(--ink);
    line-height: 0;
    cursor: pointer;
    touch-action: manipulation;
  }
  .shelf svg { display: block; width: 100%; height: 78px; }
  .shelf rect { transition: opacity .25s; }
  .shelf rect.off { opacity: .13; }

  /* ── 搜索和筛选，滚动时吸顶 ── */
  .tools {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding-top: calc(8px + env(safe-area-inset-top));
  }
  .search { position: relative; }
  .search input {
    width: 100%;
    height: 44px;
    padding: 0 44px 0 14px;
    font-size: 16px;
    background: var(--surface);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px var(--focus-soft); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search-clear {
    position: absolute; right: 2px; top: 2px;
    width: 40px; height: 40px;
    font-size: 20px; line-height: 1; color: var(--muted);
    display: none;
  }
  .search.has-text .search-clear { display: block; }

  .chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 8px var(--gutter);
    margin: 0 calc(var(--gutter) * -1);
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chips + .chips { padding-top: 0; }
  .chip {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 11px;
    font-size: 13.5px;
    white-space: nowrap;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--surface);
  }
  .chip .n { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip.empty { opacity: .42; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); font-weight: 600; }
  .chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
  .chips.places .chip { border-radius: 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--c-none); }
  .swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }

  /* ── 结果 ── */
  .status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 0 6px;
    font-size: 13.5px;
    color: var(--muted);
    min-height: 52px;
  }
  .tabs { display: flex; gap: 16px; min-width: 0; }
  .tabs button {
    flex: none;
    padding: 8px 0 6px;
    font-size: 14px;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tabs button .n { font-size: 12px; font-variant-numeric: tabular-nums; }
  .tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .status.has-tabs #statusText { display: none; }
  .subnote { font-size: 13px; color: var(--muted); padding: 0 0 4px; }
  .subnote strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .status strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .link { text-decoration: underline; text-underline-offset: 3px; color: var(--ink); padding: 6px 0; }
  .ghost {
    flex: none;
    height: 34px;
    padding: 0 12px;
    font-size: 13.5px;
    border: 1px solid var(--ink);
    border-radius: 4px;
    color: var(--ink);
  }

  .books { list-style: none; }
  @media (min-width: 900px) {
    .books { display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; }
  }
  .book { border-bottom: 1px solid var(--line); }
  .book-btn {
    display: grid;
    grid-template-columns: 5px minmax(0, 1fr) auto;
    column-gap: 13px;
    align-items: start;
    width: 100%;
    padding: 13px 0;
    text-align: left;
  }
  .spine { align-self: stretch; border-radius: 1px; background: var(--c-none); }
  .book-title {
    display: block;
    font-family: var(--serif);
    font-size: 17.5px;
    font-weight: 700;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  .book-by {
    display: block;
    margin-top: 2px;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .book-by .who { color: var(--ink); }
  .book-by .who + .pub { margin-left: .7em; }
  .book-tags { display: flex; flex-wrap: wrap; gap: 3px 12px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .book-tags span { display: inline-flex; align-items: center; gap: 5px; }
  .book-tags .dot { width: 7px; height: 7px; }
  .book-tags .flag { color: var(--hot); font-weight: 600; }
  .book-tags .kind { padding: 0 5px; border: 1px dashed var(--muted); border-radius: 3px; line-height: 1.5; }
  .place {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 3px;
    padding: 2px 7px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid var(--ink-soft);
    border-radius: 3px;
    background: var(--surface);
  }

  .empty-state { padding: 56px 0; text-align: center; color: var(--muted); font-size: 15px; }
  .empty-state .ghost { margin-top: 14px; }
  .colophon { padding: 34px 0 0; font-size: 12px; color: var(--muted); }

  /* ── 底部：想借的书 ── */
  .tray {
    position: fixed;
    left: 50%;
    bottom: calc(16px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 20;
    display: none;
    align-items: center;
    gap: 10px;
    height: 48px;
    padding: 0 18px 0 16px;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    color: var(--paper);
    background: var(--ink);
    border-radius: 24px;
    box-shadow: 0 6px 22px rgba(36, 26, 46, .28);
  }
  .tray.show { display: inline-flex; }
  .tray .count {
    min-width: 24px; height: 24px; padding: 0 7px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; font-variant-numeric: tabular-nums;
    color: var(--ink); background: var(--c-a); border-radius: 12px;
  }

  /* ── 弹层 ── */
  .scrim {
    position: fixed; inset: 0; z-index: 40;
    display: none;
    align-items: flex-end; justify-content: center;
    background: rgba(23, 16, 31, .5);
  }
  .scrim.open { display: flex; }
  .sheet {
    position: relative;
    width: 100%;
    max-width: 620px;
    max-height: 90vh;
    max-height: 90dvh;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-radius: 14px 14px 0 0;
    overflow: hidden;
    animation: rise .22s ease-out;
  }
  @keyframes rise { from { transform: translateY(28px); opacity: .4; } }
  @media (min-width: 720px) {
    .scrim { align-items: center; padding: 24px; }
    .sheet { border-radius: 10px; max-height: 84vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: none; }
    .shelf rect { transition: none; }
  }
  .band { height: 7px; flex: none; background: var(--c-none); }
  .sheet-close {
    position: absolute; top: 11px; right: 6px; z-index: 3;
    width: 48px; height: 48px;
    font-size: 24px; line-height: 1; color: var(--muted);
  }
  .sheet-body {
    position: relative; z-index: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 20px 22px calc(26px + env(safe-area-inset-bottom));
  }
  .sheet h2 {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 900;
    line-height: 1.3;
    padding-right: 34px;
    overflow-wrap: anywhere;
  }
  .sheet .by { margin-top: 6px; font-size: 14.5px; }
  .sheet .by .pub { color: var(--muted); display: block; font-size: 13.5px; }
  .sheet .book-tags { margin-top: 12px; font-size: 13px; }
  .sheet .book-tags .dot { width: 9px; height: 9px; }

  .where {
    display: flex; align-items: baseline; gap: 10px;
    margin-top: 18px; padding: 12px 14px;
    border: 1.5px solid var(--ink); border-radius: 4px;
  }
  .where .lbl { font-size: 13px; color: var(--muted); flex: none; }
  .where .val { font-family: var(--serif); font-size: 21px; font-weight: 900; display: inline-flex; align-items: center; gap: 8px; }
  .where .val .swatch { width: 13px; height: 13px; }
  .facts { margin-top: 10px; font-size: 13.5px; color: var(--muted); }
  .facts .flag { color: var(--hot); font-weight: 600; }

  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .btn {
    flex: 1;
    min-height: 46px;
    padding: 8px 12px;
    font-size: 15px;
    font-weight: 600;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
  }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .btn.quiet { flex: none; }

  .sheet h3 { margin: 26px 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .prose { font-size: 15px; line-height: 1.8; white-space: pre-line; overflow-wrap: anywhere; max-width: 36em; }
  .prose.wait { color: var(--muted); }

  .wish { list-style: none; margin-top: 14px; }
  .wish li {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid var(--line);
  }
  .wish .t { font-family: var(--serif); font-weight: 700; font-size: 16px; line-height: 1.35; }
  .wish .p { margin-top: 3px; font-size: 12.5px; color: var(--muted); }
  .wish .rm { font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 8px 0 8px 8px; }
</style>
</head>
<body>

<header class="masthead wrap">
  <h1>云贵川风味家常菜<span class="sep">·</span>书单</h1>
  <p class="motto">「<span lang="en">a prime resource for survival</span>」</p>
  <div class="shelf" id="shelf" role="img" aria-label="全部藏书按主题排开的色带，点颜色可以只看那一类"></div>
</header>

<div class="tools">
  <div class="wrap">
    <div class="search" id="searchBox">
      <input type="search" id="q" placeholder="书名、作者，或任何一个词" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="搜索藏书">
      <button class="search-clear" id="qClear" aria-label="清空搜索">×</button>
    </div>
    <div class="chips themes" id="themeChips" role="group" aria-label="按主题筛选"></div>
    <div class="chips places" id="placeChips" role="group" aria-label="按存放位置筛选"></div>
  </div>
</div>

<main class="wrap">
  <div class="status">
    <div class="tabs" id="kindTabs" role="tablist" aria-label="出版类型" hidden>
      <button role="tab" data-k="">全部 <span class="n"></span></button>
      <button role="tab" data-k="0">正式出版 <span class="n"></span></button>
      <button role="tab" data-k="1">民间出版 <span class="n"></span></button>
    </div>
    <span id="statusText" aria-live="polite">…</span>
    <button class="ghost" id="lucky">偶遇一本</button>
  </div>
  <p class="subnote" id="subnote" hidden></p>
  <ol class="books" id="books"></ol>
  <div class="empty-state" id="empty" hidden>
    <p>没有这样的书。</p>
    <button class="ghost" id="emptyReset">看全部</button>
  </div>
  <p class="colophon" id="colophon"></p>
</main>

<button class="tray" id="tray"><span class="count" id="trayCount">0</span>想借</button>

<div class="scrim" id="bookScrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="bkTitle">
    <div class="band" id="bkBand"></div>
    <button class="sheet-close" data-close aria-label="关闭">×</button>
    <div class="sheet-body">
      <h2 id="bkTitle"></h2>
      <p class="by" id="bkBy"></p>
      <div class="book-tags" id="bkTags"></div>
      <div class="where"><span class="lbl">放在</span><span class="val" id="bkWhere"></span></div>
      <p class="facts" id="bkFacts"></p>
      <div class="actions">
        <button class="btn solid" id="bkWish"></button>
        <button class="btn quiet" id="bkCopy">复制</button>
      </div>
      <div id="bkDescWrap"><h3>内容</h3><p class="prose" id="bkDesc"></p></div>
      <div id="bkAuthorWrap"><h3>作者</h3><p class="prose" id="bkAuthor"></p></div>
    </div>
  </div>
</div>

<div class="scrim" id="wishScrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="wishTitle">
    <div class="band" style="background: var(--ink)"></div>
    <button class="sheet-close" data-close aria-label="关闭">×</button>
    <div class="sheet-body">
      <h2 id="wishTitle">想借</h2>
      <ul class="wish" id="wishList"></ul>
      <div class="actions">
        <button class="btn solid" id="wishCopy">复制清单</button>
        <button class="btn quiet" id="wishClear">清空</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // 主题 → 颜色代号（对应上面 CSS 里的 --c-*）
  var KEY = {
    "酷儿": "q", "女性主义与性别": "f", "性与亲密": "x", "社会学与人类学": "s", "哲学与思想": "p",
    "历史与政治": "h", "劳动与经济": "l", "公益与行动": "g", "文学": "w", "漫画与艺术": "a",
    "心理与灵性": "m", "身体与健康": "b", "生活与工具书": "t"
  };
  // 色带上的排列顺序：沿色相走一圈，最后是棕和黑
  var SPECTRUM = ["酷儿", "性与亲密", "文学", "漫画与艺术", "生活与工具书", "身体与健康", "心理与灵性",
    "公益与行动", "社会学与人类学", "哲学与思想", "女性主义与性别", "历史与政治", "劳动与经济"];

    var s = readHash();
    state.q = s.q; state.tag = s.tag; state.loc = s.loc; state.kind = s.kind;
    $("q").value = state.q;
    render();
    if (s.book && byId[s.book]) openBook(s.book, false);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
  ["bookScrim", "wishScrim"].forEach(function (id) {
    $(id).addEventListener("click", function (e) {
      if (e.target === this || e.target.closest("[data-close]")) closeSheet();
    });
  });

  function setWishBtn(b) {
    var inList = wish.indexOf(b.id) > -1;
    $("bkWish").textContent = inList ? "不借了" : "想借";
    $("bkWish").classList.toggle("solid", !inList);
  }
  function fillDetails(b) {
    var d = details && details[b.id];
    var waiting = !details;
    $("bkDescWrap").hidden = !waiting && !(d && d[0]);
    $("bkAuthorWrap").hidden = !(d && d[1]);
    $("bkDesc").textContent = waiting ? "简介加载中…" : (d && d[0]) || "";
    $("bkDesc").classList.toggle("wait", waiting);
    $("bkAuthor").textContent = (d && d[1]) || "";
  }
  function openBook(id, push) {
    var b = byId[id];
    if (!b) return;
    state.book = id;
    $("bkBand").style.background = stripes(b.g, "to right");
    $("bkTitle").textContent = b.t;
    var pubLine = [b.p, fmtYear(b.y)].filter(Boolean).join("，");
    $("bkBy").innerHTML = (b.a ? esc(b.a) : "") + (pubLine ? '<span class="pub">' + esc(pubLine) + "</span>" : "");
    $("bkBy").hidden = !(b.a || pubLine);
    $("bkTags").innerHTML = tagsHtml(b, b.k ? '<span class="kind">民间出版物</span>' : "");
    $("bkWhere").innerHTML = placeHtml(b.l);
    var facts = [];
    if (b.lent) facts.push('<span class="flag">现在借给了' + esc(b.lent) + "</span>");
    if (b.status) facts.push("阅读状态：" + esc(b.status));
    if (b.note) facts.push("备注：" + esc(b.note));
    $("bkFacts").innerHTML = facts.join("<br>");
    $("bkFacts").hidden = !facts.length;
    $("bkCopy").textContent = "复制";
    setWishBtn(b);
    fillDetails(b);
    showScrim($("bookScrim"), push);
    if (!push) syncUrl();
  }
  function line(b) { return "《" + b.t + "》（" + b.l + "）"; }

  function copyText(text, btn, done) {
    function ok() { btn.textContent = done; }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
      var good = false;
      try { good = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      if (good) ok(); else window.prompt("长按下面的文字复制：", text);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  }

  function renderWish() {
    wish = wish.filter(function (id) { return byId[id]; });
    $("wishList").innerHTML = wish.length ? wish.map(function (id) {
      var b = byId[id];
      return '<li><div><div class="t">' + esc(b.t) + '</div><div class="p">' + placeHtml(b.l) + "</div></div>" +
        '<button class="rm" data-rm="' + esc(id) + '">移出</button></li>';
    }).join("") : '<li><div class="p">还没有想借的书。</div></li>';
    $("wishCopy").textContent = "复制清单";
    $("wishCopy").disabled = !wish.length;
    $("wishClear").hidden = !wish.length;
  }

  // ── 事件 ──
  $("books").addEventListener("click", function (e) {
    var btn = e.target.closest(".book-btn");
    if (btn) openBook(btn.getAttribute("data-id"), true);
  });
  var typing;
  $("q").addEventListener("input", function () {
    state.q = this.value;
    render();
    clearTimeout(typing); typing = setTimeout(syncUrl, 400);
  });
  $("q").addEventListener("keydown", function (e) { if (e.key === "Enter") this.blur(); });
  $("qClear").addEventListener("click", function () { state.q = ""; $("q").value = ""; render(); syncUrl(); $("q").focus(); });
  function resetAll() {
    state.q = ""; state.tag = ""; state.loc = ""; $("q").value = "";
    render(); syncUrl(); backToTop();
    $("themeChips").scrollLeft = 0; $("placeChips").scrollLeft = 0;
  }
  $("statusText").addEventListener("click", function (e) { if (e.target.id === "reset") resetAll(); });
  $("subnote").addEventListener("click", function (e) { if (e.target.id === "reset2") resetAll(); });
  $("kindTabs").addEventListener("click", function (e) {
    var t = e.target.closest("[data-k]");
    if (!t) return;
    state.kind = t.getAttribute("data-k");
    render(); syncUrl(); backToTop();
  });
  $("emptyReset").addEventListener("click", function () { state.kind = ""; resetAll(); });
  $("lucky").addEventListener("click", function () {
    if (shown.length) openBook(shown[Math.floor(Math.random() * shown.length)].id, true);
  });
  $("bkWish").addEventListener("click", function () {
    var b = byId[state.book]; if (!b) return;
    var i = wish.indexOf(b.id);
    if (i > -1) wish.splice(i, 1); else wish.push(b.id);
    saveWish(); setWishBtn(b); render();
  });
  $("bkCopy").addEventListener("click", function () {
    var b = byId[state.book]; if (b) copyText(line(b), this, "已复制");
  });
  $("tray").addEventListener("click", function () { renderWish(); showScrim($("wishScrim"), true); });
  $("wishList").addEventListener("click", function (e) {
    var id = e.target.getAttribute && e.target.getAttribute("data-rm");
    if (!id) return;
    wish = wish.filter(function (x) { return x !== id; });
    saveWish(); renderWish(); render();
  });
  $("wishCopy").addEventListener("click", function () {
    var text = "想借：\n" + wish.map(function (id) { return line(byId[id]); }).join("\n");
    copyText(text, this, "已复制");
  });
  $("wishClear").addEventListener("click", function () { wish = []; saveWish(); renderWish(); render(); });

  // ── 加载 ──
  function getJson(url) {
    return fetch(url, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  }
  getJson("books.json").then(function (data) {
    books = data.books;
    tags = data.tags || [];
    var placeCount = {};
    books.forEach(function (b, i) {
      b._i = i; b.g = b.g || [];
      byId[b.id] = b;
      b._m = norm([b.t, b.a, b.p, b.l, b.g.join(" "), b.lent, b.note].join(" "));
      placeCount[b.l] = (placeCount[b.l] || 0) + 1;
    });
    places = Object.keys(placeCount).sort(function (a, b) { return placeCount[b] - placeCount[a]; });
    var used = {};
    books.forEach(function (b) { b.g.forEach(function (t) { used[t] = 1; }); });
    tags = tags.filter(function (t) { return used[t]; });

    if (data.updated) $("colophon").textContent = "更新于 " + data.updated;
    hasKind = books.some(function (b) { return b.k; });
    $("kindTabs").hidden = !hasKind;
    document.querySelector(".status").classList.toggle("has-tabs", hasKind);
    buildChips($("themeChips"), tags, "tag");
    buildChips($("placeChips"), places, "loc");
    buildShelf();

    var s = readHash();
    state.q = s.q; state.tag = tags.indexOf(s.tag) > -1 ? s.tag : ""; state.loc = placeCount[s.loc] ? s.loc : "";
    state.kind = hasKind ? s.kind : "";
    $("q").value = state.q;
    render();
    revealChip($("themeChips"), state.tag); revealChip($("placeChips"), state.loc);
    if (s.book && byId[s.book]) openBook(s.book, false);

    // 简介比较大，等列表出来以后再悄悄加载
    return getJson("details.json").then(function (d) {
      details = d;
      books.forEach(function (b) { if (d[b.id]) b._d = norm(d[b.id][0]); });
      if (state.q.trim()) render();
      if (state.book && byId[state.book]) fillDetails(byId[state.book]);
    }, function () {
      details = {};
      if (state.book && byId[state.book]) fillDetails(byId[state.book]);
    });
  }).catch(function () {
    if (!books.length) {
      $("statusText").textContent = "没有加载出来，刷新试试。";
      $("lucky").hidden = true;
    }
  });
})();
</script>
</body>
</html>
